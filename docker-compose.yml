services:
  skysentinel_database:
    image: postgis/postgis:16-3.4
    container_name: skysentinel_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  skysentinel_backend:
    build:
      context: ./backend
    container_name: skysentinel_api_container
    restart: always
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      skysentinel_database:
        condition: service_healthy
    command: python run.py

  skysentinel_frontend:
    image: node:20
    container_name: skysentinel_ui_container
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - skysentinel_backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules: